<title>Dino-Memory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: ein Bildschirm, Dschungel-Lichtung; oben schmale Leiste, darunter festes Kartenraster */
:root {
  color-scheme: light;
  --jungle: #cfe9c6;
  --jungle-deep: #a9d69d;
  --leaf: #2e7d5b;
  --leaf-light: #74c095;
  --ink: #2b2140;
  --paper: #fffdf6;
  --sun: #ffcf4a;
  --font-display: "Fredoka", "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background:
    radial-gradient(circle at 12% 18%, #e4f5dc 0 18%, transparent 40%),
    radial-gradient(circle at 88% 85%, var(--jungle-deep) 0 14%, transparent 42%),
    var(--jungle);
  color: var(--ink);
  font-family: var(--font-display);
  overflow: hidden;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }

.screen {
  height: 100%;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  display: flex; flex-direction: column;
}

/* ---------- Startbildschirm ---------- */
#start { align-items: center; justify-content: center; gap: clamp(16px, 4vh, 40px); text-align: center; }
.logo { margin: 0; font-size: clamp(44px, 9vw, 96px); font-weight: 700; line-height: 1; letter-spacing: .01em; color: var(--leaf); text-shadow: 0 5px 0 var(--paper); text-wrap: balance; }
.logo span { color: #e2574c; }
.hello { display: flex; gap: clamp(8px, 2vw, 24px); }
.hello .bubble { width: clamp(76px, 14vw, 140px); aspect-ratio: 1; border-radius: 28%; border: 5px solid var(--paper); box-shadow: 0 6px 0 rgba(43,33,64,.18); display: grid; place-items: center; animation: wobble 2.6s ease-in-out infinite; }
.hello .bubble:nth-child(2) { animation-delay: .4s; }
.hello .bubble:nth-child(3) { animation-delay: .8s; }
.hello svg { width: 86%; }
.pick { font-size: clamp(18px, 2.6vw, 26px); font-weight: 600; margin: 0; }
.levels { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(10px, 2vw, 22px); }
.level {
  width: clamp(120px, 18vw, 170px);
  border: none; border-radius: 26px;
  background: var(--paper);
  box-shadow: 0 7px 0 var(--leaf);
  padding: 16px 10px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  transition: transform .12s;
}
.level:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--leaf); }
.level .num { font-size: clamp(36px, 5vw, 52px); font-weight: 700; line-height: 1; color: var(--leaf); }
.level .lbl { font-size: 17px; font-weight: 600; }
.mini { display: grid; gap: 3px; }
.mini i { width: 9px; height: 11px; border-radius: 3px; background: var(--leaf-light); }

/* ---------- Spiel ---------- */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 60px; flex: none; }
.round {
  width: 56px; height: 56px; border-radius: 50%; border: none;
  background: var(--paper); box-shadow: 0 5px 0 rgba(43,33,64,.2);
  display: grid; place-items: center; flex: none;
}
.round:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(43,33,64,.2); }
.round svg { width: 30px; height: 30px; }
.round.off { background: #e2574c; }
.eggs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; min-width: 0; }
.egg { width: 20px; height: 26px; border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%; background: rgba(255,253,246,.6); border: 3px solid var(--paper); transition: background .4s, transform .4s; }
.egg.full { transform: scale(1.15); border-color: var(--ink); }

.board { flex: 1; min-height: 0; display: grid; place-items: center; }
.grid { display: grid; gap: var(--gap); }
.card {
  width: var(--size); height: var(--size);
  padding: 0; border: none; background: none;
  perspective: 900px;
  container-type: inline-size;
}
.card.gone { visibility: hidden; }
.inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,1.4,.5,1); }
.card.open .inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 16%; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.back {
  background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.08) 0 40%, transparent 41%),
    var(--leaf);
  border: max(3px, 3cqw) solid var(--paper);
  box-sizing: border-box;
  box-shadow: 0 6px 0 rgba(43,33,64,.22);
  display: grid; place-items: center;
}
.back svg { width: 58%; }
.front {
  transform: rotateY(180deg);
  background: radial-gradient(circle at 50% 38%, rgba(255,255,255,.45) 0 30%, transparent 62%), var(--c);
  border: max(3px, 3cqw) solid var(--paper);
  box-sizing: border-box;
  box-shadow: 0 6px 0 rgba(43,33,64,.22);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.front svg { width: 86%; margin-top: -4%; }
.name {
  position: absolute; left: 6%; right: 6%; bottom: 5%;
  background: rgba(255,253,246,.88); border-radius: 999px;
  font-size: min(8.4cqw, 20px); font-weight: 600; line-height: 1.5;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card.vanish .inner { animation: vanish .6s ease-in forwards; }

/* auf dem svg selbst, damit stroke-Attribute einzelner Formen gewinnen */
.dino { stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }

.spark { position: fixed; width: 16px; height: 16px; pointer-events: none; z-index: 5; animation: spark .8s ease-out forwards; }
.spark svg { width: 100%; height: 100%; }

/* ---------- Gewonnen ---------- */
#win { position: fixed; inset: 0; z-index: 10; background: rgba(46,125,91,.94); color: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(14px, 4vh, 36px); overflow: hidden; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#win h2 { margin: 0; font-size: clamp(48px, 10vw, 110px); line-height: 1; text-shadow: 0 6px 0 rgba(43,33,64,.35); animation: pop .7s cubic-bezier(.3,1.6,.5,1) both; }
.parade-lane { width: 100vw; height: clamp(110px, 24vh, 200px); position: relative; }
.parade { position: absolute; top: 0; left: 0; height: 100%; display: flex; gap: 2vw; animation: march 12s linear infinite; }
.parade .dancer { height: 100%; aspect-ratio: 1; animation: hop .55s ease-in-out infinite alternate; transform-origin: 50% 100%; }
.parade .dancer svg { width: 100%; height: 100%; }
.win-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
.big {
  border: none; border-radius: 999px; padding: 18px 44px;
  background: var(--sun); color: var(--ink);
  font-size: clamp(26px, 4vw, 38px); font-weight: 700;
  box-shadow: 0 7px 0 #c9951c;
}
.big:active { transform: translateY(5px); box-shadow: 0 2px 0 #c9951c; }
.win-actions { align-items: center; }
.win-home { width: 76px; height: 76px; box-shadow: 0 7px 0 rgba(43,33,64,.3); }
.win-home svg { width: 40px; height: 40px; }
.confetti { position: absolute; top: -20px; width: 12px; height: 18px; border-radius: 4px; animation: fall linear infinite; }

@keyframes wobble { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-6px); } }
@keyframes vanish { 0% { transform: rotateY(180deg) scale(1); } 30% { transform: rotateY(180deg) scale(1.12); } 100% { transform: rotateY(180deg) scale(0) rotate(25deg); opacity: 0; } }
@keyframes spark { from { transform: translate(0,0) scale(1); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; } }
@keyframes pop { from { transform: scale(.2); } to { transform: scale(1); } }
@keyframes march { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }
@keyframes hop { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-18%) rotate(6deg); } }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

@media (prefers-reduced-motion: reduce) {
  .hello .bubble, .parade .dancer, .confetti { animation: none; }
  .parade { animation-duration: 40s; }
  .inner { transition-duration: .15s; }
}
</style>

<section id="start" class="screen">
  <h1 class="logo">Dino<span>-</span>Memory</h1>
  <div class="hello" id="hello"></div>
  <p class="pick">Wie viele Karten?</p>
  <div class="levels" id="levels"></div>
</section>

<section id="game" class="screen" hidden>
  <div class="bar">
    <button class="round" id="home" aria-label="Zurück zum Start">
      <svg viewBox="0 0 32 32" fill="none" stroke="#2b2140" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15 L16 5 L27 15"/><path d="M8 13 V27 H24 V13"/><path d="M13 27 V19 H19 V27"/></svg>
    </button>
    <div class="eggs" id="eggs" aria-label="Gefundene Paare"></div>
    <button class="round" id="sound" aria-label="Ton aus">
      <svg viewBox="0 0 32 32" fill="none" stroke="#2b2140" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 H10 L17 6 V26 L10 20 H5 Z" fill="#2b2140"/><path id="wave1" d="M21 11 Q24 16 21 21"/><path id="wave2" d="M24.5 8 Q30 16 24.5 24"/><path id="mute" d="M21 11 L29 21 M29 11 L21 21" hidden/></svg>
    </button>
  </div>
  <div class="board" id="board"><div class="grid" id="grid"></div></div>
</section>

<section id="win" hidden>
  <h2>Geschafft!</h2>
  <div class="parade-lane"><div class="parade" id="parade"></div></div>
  <div class="win-actions">
    <button class="big" id="again">Nochmal!</button>
    <button class="round win-home" id="other" aria-label="Zurück zum Start">
      <svg viewBox="0 0 32 32" fill="none" stroke="#2b2140" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15 L16 5 L27 15"/><path d="M8 13 V27 H24 V13"/><path d="M13 27 V19 H19 V27"/></svg>
    </button>
  </div>
</section>

<script>
const OL = '#2b2140';
const eye = (x, y) => `<circle cx="${x}" cy="${y}" r="8" fill="#fff"/><circle cx="${x + 1.5}" cy="${y + 1}" r="4.6" fill="${OL}" stroke="none"/><circle cx="${x + 3}" cy="${y - 1.4}" r="1.8" fill="#fff" stroke="none"/>`;

    return `<path d="M52 128 Q22 132 12 160 Q34 150 58 146 Z" fill="${B}"/>
    <rect x="68" y="140" width="18" height="42" rx="8" fill="${D}"/><rect x="112" y="136" width="18" height="46" rx="8" fill="${D}"/>
    <path d="M118 120 Q128 72 136 34 L160 38 Q152 84 148 130 Z" fill="${B}"/>
    <ellipse cx="95" cy="132" rx="52" ry="30" fill="${B}"/>
    <rect x="52" y="144" width="20" height="40" rx="9" fill="${B}"/><rect x="124" y="140" width="20" height="44" rx="9" fill="${B}"/>
    ${dots([[78, 122, 6], [100, 116, 5], [66, 136, 4], [112, 130, 4]], '#a6dc8f')}
    <circle cx="146" cy="24" r="10" fill="${B}"/>
    <ellipse cx="154" cy="38" rx="24" ry="15" fill="${B}"/>
    ${eye(156, 33)}${cheek(150, 45)}${smile(163, 43, 10)}`; })() },

  { id: 'rex', name: 'T-Rex', say: 'Tyrannosaurus Rex', bg: '#ff9f43', svg: (() => { const B = '#5cb87a', D = '#46a066';
    return `<path d="M70 108 Q30 118 6 150 Q42 142 80 136 Z" fill="${B}"/>
    <path d="M80 136 L74 180 L96 180 L94 136 Z" fill="${D}"/>
    <ellipse cx="102" cy="112" rx="40" ry="34" transform="rotate(-25 102 112)" fill="${B}"/>
    <ellipse cx="114" cy="122" rx="17" ry="22" transform="rotate(-25 114 122)" fill="#b9e6a0" stroke="none"/>
    <path d="M94 150 L90 182 L116 182 L110 150 Z" fill="${B}"/>

    ${limb('M130 108 Q142 110 145 121', B, 6)}
    <rect x="112" y="34" width="72" height="50" rx="22" fill="${B}"/>

    <path d="M151 73 l4 7 l4 -6 Z M166 74 l4 7 l4 -7 Z" fill="#fff" stroke-width="2"/>
    <circle cx="174" cy="48" r="2.4" fill="${OL}" stroke="none"/>
    ${eye(140, 52)}${cheek(132, 66)}`; })() },

  { id: 'trice', name: 'Triceratops', say: 'Tri-zeratops', bg: '#ffe156', svg: (() => { const B = '#a98be0', D = '#8d6fc8', F = '#d4c2fb';
    return `<rect x="60" y="140" width="18" height="40" rx="8" fill="${D}"/><rect x="112" y="140" width="18" height="40" rx="8" fill="${D}"/>
    <path d="M44 122 Q18 128 12 148 Q30 142 50 140 Z" fill="${B}"/>

    ${dots([[120, 74, 4], [114, 96, 4], [118, 120, 4], [134, 68, 4]], '#ff8fb7')}
    <path d="M176 110 Q198 120 180 134 Z" fill="#f6e3b4"/>
    <ellipse cx="156" cy="118" rx="28" ry="22" fill="${B}"/>

    <path d="M175 110 L184 96 L183 114 Z" fill="#fff4d6"/>
    ${eye(152, 116)}${cheek(146, 128)}${smile(164, 128, 10)}`; })() },

  { id: 'stego', name: 'Stegosaurus', say: 'Stegosaurus', bg: '#ff8fb7', svg: (() => { const B = '#4fb3a9', D = '#3c978e', P = '#ffa24c';
    const plate = (x, y, h) => `<path d="M${x - 12} ${y} L${x} ${y - h} L${x + 12} ${y} Z" fill="${P}"/>`;
    return `${plate(55, 116, 22)}${plate(76, 107, 30)}${plate(98, 104, 34)}${plate(120, 106, 30)}${plate(140, 113, 22)}
    <path d="M14 108 L2 92 L22 104 Z" fill="${P}"/><path d="M26 116 L20 98 L34 112 Z" fill="${P}"/>
    <path d="M48 124 Q22 120 8 104 Q20 136 52 142 Z" fill="${B}"/>

    <ellipse cx="166" cy="140" rx="21" ry="14" fill="${B}"/>

    <ellipse cx="94" cy="140" rx="18" ry="22" fill="${B}"/>
    ${limb('M126 118 Q136 124 136 134', B, 6)}
    ${dots([[74, 112, 5], [96, 104, 4], [64, 128, 4]], '#ffcf94')}
    <ellipse cx="178" cy="72" rx="13" ry="8" fill="#ffd29a"/>

    <path d="M92 68 L58 54 L94 80 Z" fill="${W}"/>

  { id: 'anky', name: 'Ankylosaurus', say: 'Ankylosaurus', bg: '#7ee0b5', svg: (() => { const B = '#d08c5b', D = '#a5643a';
    return `${limb('M46 134 L20 124', B, 7)}<ellipse cx="18" cy="124" rx="15" ry="12" fill="${D}"/>
    <rect x="56" y="134" width="20" height="36" rx="8" fill="${D}"/><rect x="132" y="134" width="20" height="36" rx="8" fill="${D}"/>
    <path d="M58 92 L52 78 L68 88 Z M92 84 L92 68 L104 82 Z M128 86 L136 72 L140 90 Z" fill="#fff4d6"/>
    <path d="M38 142 Q42 84 104 82 Q164 84 170 142 Z" fill="${B}"/>
    ${dots([[70, 118, 7], [96, 104, 7], [124, 106, 7], [146, 122, 6], [84, 132, 6], [110, 128, 6], [136, 136, 5], [58, 136, 5]], D)}
    <rect x="44" y="140" width="22" height="34" rx="9" fill="${B}"/><rect x="142" y="140" width="22" height="34" rx="9" fill="${B}"/>
    <path d="M166 120 L170 106 L178 118 Z" fill="#fff4d6"/>
    <ellipse cx="178" cy="132" rx="20" ry="15" fill="${B}"/>
    ${eye(180, 128)}${cheek(174, 140)}${smile(184, 139, 8)}`; })() },

  { id: 'archae', name: 'Archaeopteryx', say: 'Archäopterix', bg: '#ffc4a3', svg: (() => { const B = '#5b8def', W = '#ffb84d', T = '#3f6fd1';
    return `<path d="M72 118 Q34 116 8 96 Q22 116 14 130 Q30 126 22 146 Q46 140 74 136 Z" fill="${T}"/>
    <path d="M20 110 Q44 122 66 124 M26 136 Q48 132 68 130" fill="none" stroke-width="2.5"/>
    ${limb('M98 138 L94 180', W, 5)}
    <path d="M124 106 Q132 92 136 84 L156 94 Q148 108 136 118 Z" fill="${B}"/>
    <ellipse cx="104" cy="118" rx="36" ry="26" fill="${B}"/>
    <path d="M84 104 Q112 92 134 110 L126 116 L130 124 L118 124 L120 132 Q94 134 84 104 Z" fill="${W}"/>
    <path d="M134 110 l8 -2 M134 110 l7 4" fill="none" stroke-width="3"/>
    ${limb('M112 140 L116 180', W, 5)}
    <path d="M108 182 L116 180 L126 184" fill="none" stroke-width="3"/>
    <path d="M136 70 L126 56 L142 64 L140 50 L152 66 Z" fill="${W}"/>

    ${eye(149, 78)}${cheek(140, 90)}`; })() },

  { id: 'spino', name: 'Spinosaurus', say: 'Spinosaurus', bg: '#b8e05a', svg: (() => { const B = '#3f8fd2', D = '#3176b3', S = '#ff7b6b';
    return `<path d="M58 114 Q68 40 100 38 Q132 40 142 110 Z" fill="${S}"/>
    <path d="M80 56 L84 110 M100 40 L100 108 M120 56 L116 110" fill="none" stroke-width="3"/>
    <path d="M60 120 Q24 128 6 110 Q20 146 66 142 Z" fill="${B}"/>
    <rect x="72" y="138" width="18" height="44" rx="8" fill="${D}"/>
    <ellipse cx="100" cy="122" rx="46" ry="28" fill="${B}"/>
    <rect x="108" y="140" width="20" height="44" rx="9" fill="${B}"/>
    ${limb('M138 124 Q148 130 148 140', B, 6)}
    <path d="M134 100 Q148 82 168 86 L196 94 Q200 104 190 106 L152 114 Z" fill="${B}"/>
    <circle cx="188" cy="96" r="2.2" fill="${OL}" stroke="none"/>
    <path d="M166 104 Q178 106 190 104" fill="none" stroke-width="3"/>
    ${eye(154, 94)}${cheek(150, 106)}`; })() },

  { id: 'velo', name: 'Velociraptor', say: 'Velociraptor', bg: '#ff6f6f', svg: (() => { const B = '#ffd166', D = '#e0b24a', F = '#7c6ad6';
    return `<path d="M14 92 L0 82 L6 98 L0 112 L16 106 Z" fill="${F}"/>
    <path d="M74 104 L12 92 L14 106 L76 124 Z" fill="${B}"/>
    <path d="M92 126 L84 158 L76 182 L98 182 L98 160 L106 130 Z" fill="${D}"/>
    <path d="M118 100 Q132 80 140 64 L158 72 Q148 94 132 116 Z" fill="${B}"/>
    <ellipse cx="100" cy="112" rx="38" ry="23" transform="rotate(-10 100 112)" fill="${B}"/>
    <path d="M84 104 L88 118 M100 100 L102 116 M116 100 L114 114" fill="none" stroke="#e09b3d" stroke-width="5"/>
    <path d="M104 140 L112 162 L104 182 L128 182 L120 160 L118 140 Z" fill="${B}"/>
    <ellipse cx="108" cy="130" rx="15" ry="18" fill="${B}"/>
    <path d="M128 112 Q140 118 140 130 L134 128 Z" fill="${F}"/>
    <path d="M140 56 L128 38 L144 50 L140 34 L154 52 Z" fill="${F}"/>
    <ellipse cx="160" cy="66" rx="25" ry="14" transform="rotate(8 160 66)" fill="${B}"/>
    <path d="M168 76 Q176 78 182 74" fill="none" stroke-width="3"/>
    <path d="M172 77 l3 5 l3 -5 Z" fill="#fff" stroke-width="2"/>
    ${eye(156, 61)}${cheek(150, 73)}`; })() },

  { id: 'pachy', name: 'Pachycephalosaurus', say: 'Pachycephalosaurus', bg: '#e3c08f', svg: (() => { const B = '#66b3a0', D = '#4f9886';
    return `<path d="M64 116 Q26 110 6 128 Q34 140 70 136 Z" fill="${B}"/>
    <rect x="82" y="136" width="18" height="46" rx="8" fill="${D}"/>
    <path d="M118 102 Q128 86 134 76 L156 84 Q148 102 136 116 Z" fill="${B}"/>
    <ellipse cx="98" cy="120" rx="38" ry="30" transform="rotate(-20 98 120)" fill="${B}"/>
    <path d="M94 150 L90 182 L114 182 L110 150 Z" fill="${B}"/>
    <ellipse cx="98" cy="140" rx="18" ry="22" fill="${B}"/>
    ${limb('M126 116 Q136 122 136 132', B, 6)}
    <circle cx="148" cy="62" r="27" fill="#f6efe0"/>
    ${dots([[124, 72, 4], [130, 82, 4], [170, 70, 4]], '#c9b38f')}
    <ellipse cx="152" cy="80" rx="25" ry="16" fill="${B}"/>
    ${eye(154, 76)}${cheek(146, 88)}${smile(164, 86, 9)}`; })() },

  { id: 'mosa', name: 'Mosasaurus', say: 'Mosasaurus', bg: '#3f8efc', svg: (() => { const B = '#8fd694', D = '#6dbb73';
    return `<path d="M8 180 q10 -8 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#ffffff" stroke-width="3" opacity=".6"/>
    <path d="M40 118 L8 90 L20 122 L6 152 Z" fill="${D}"/>
    <ellipse cx="82" cy="136" rx="18" ry="7" transform="rotate(30 82 136)" fill="${D}"/>
    <path d="M84 102 Q94 82 106 100 Z" fill="${D}"/>
    <path d="M30 122 Q60 96 120 98 Q160 100 188 112 Q172 134 120 138 Q60 142 30 122 Z" fill="${B}"/>
    <ellipse cx="108" cy="130" rx="44" ry="6" fill="#e9f5d0" stroke="none"/>
    <path d="M144 118 Q166 122 186 114" fill="none" stroke-width="3.5"/>
    <path d="M154 120 l3 6 l3 -5 Z M167 120 l3 6 l3 -6 Z" fill="#fff" stroke-width="2"/>
    ${dots([[70, 112, 4], [90, 108, 4], [110, 106, 4]], '#bfe9c2')}
    <ellipse cx="96" cy="144" rx="20" ry="8" transform="rotate(30 96 144)" fill="${B}"/>
    <ellipse cx="138" cy="140" rx="16" ry="7" transform="rotate(30 138 140)" fill="${B}"/>
    ${eye(150, 106)}${cheek(142, 116)}`; })() },
];

const dinoSVG = d => `<svg class="dino" viewBox="0 0 200 200" aria-hidden="true">${d.svg}</svg>`;
// dreizehiger Dino-Fußabdruck
const FOOT = `<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="#74c095"><path d="M30 64 Q30 86 50 90 Q70 86 70 64 Q60 54 50 56 Q40 54 30 64 Z"/><path d="M33 60 Q20 42 12 26 L10 14 L22 24 Q34 40 44 54 Z"/><path d="M44 54 Q44 34 46 18 L50 4 L54 18 Q56 34 56 54 Z"/><path d="M67 60 Q80 42 88 26 L90 14 L78 24 Q66 40 56 54 Z"/></g></svg>`;
const STAR = c => `<svg viewBox="0 0 20 20"><path d="M10 0 L12.5 7.5 L20 10 L12.5 12.5 L10 20 L7.5 12.5 L0 10 L7.5 7.5 Z" fill="${c}"/></svg>`;

// Raster: Spalten x Zeilen im Querformat; im Hochformat getauscht
const LEVELS = { 6: [4, 3], 8: [4, 4], 10: [5, 4], 12: [6, 4] };

const $ = id => document.getElementById(id);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------- Ton ----------
let soundOn = true, actx = null, voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /^de[-_]DE/i.test(v.lang) && /Anna|Petra|Helena|Google|Marlene|Vicki/i.test(v.name))
       || vs.find(v => /^de/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text) {
  if (!soundOn || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE'; if (voice) u.voice = voice;
    u.rate = 0.85; u.pitch = 1.15;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function tone(freq, start, dur, type = 'sine', vol = 0.18) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + start, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
const chime = () => [660, 830, 990, 1320].forEach((f, i) => tone(f, i * 0.09, 0.3, 'sine', 0.14));
const fanfare = () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * 0.16, 0.35, 'triangle', 0.16));

// ---------- Start ----------
['brachio', 'trice', 'para'].forEach(id => {
  const d = DINOS.find(x => x.id === id);
  $('hello').insertAdjacentHTML('beforeend', `<div class="bubble" style="background:${d.bg}">${dinoSVG(d)}</div>`);
});
Object.entries(LEVELS).forEach(([pairs, [c, r]]) => {
  const b = document.createElement('button');
  b.className = 'level';
  b.innerHTML = `<span class="num">${pairs * 2}</span><span class="mini" style="grid-template-columns:repeat(${c},auto)">${'<i></i>'.repeat(c * r)}</span><span class="lbl">Karten</span>`;
  b.onclick = () => startGame(+pairs);
  $('levels').append(b);
});

// ---------- Spiel ----------
let cards = [], first = null, lock = false, found = 0, pairs = 0, cols = 4, rows = 3, timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));

function startGame(n) {
  timers.forEach(clearTimeout); timers = [];
  pairs = n; found = 0; first = null; lock = false;
  const [c, r] = LEVELS[n];
  // Ausrichtung wird beim Start festgelegt, damit beim Drehen des Tablets nichts verrutscht
  const portrait = innerHeight > innerWidth;
  cols = portrait ? r : c; rows = portrait ? c : r;
  const chosen = shuffle(DINOS.slice()).slice(0, n);
  cards = shuffle([...chosen, ...chosen]).map(d => ({ d, open: false, gone: false, el: null }));

  const grid = $('grid');
  grid.innerHTML = '';
  grid.style.gridTemplateColumns = `repeat(${cols}, var(--size))`;
  cards.forEach((c, i) => {
    const el = document.createElement('button');
    el.className = 'card';
    el.setAttribute('aria-label', 'Verdeckte Karte');
    el.innerHTML = `<div class="inner"><div class="face back">${FOOT}</div><div class="face front" style="--c:${c.d.bg}">${dinoSVG(c.d)}<span class="name">${c.d.name}</span></div></div>`;
    el.onclick = () => tap(i);
    c.el = el; grid.append(el);
  });
  $('eggs').innerHTML = '<span class="egg"></span>'.repeat(n);

  $('start').hidden = true; $('win').hidden = true; $('game').hidden = false;
  fit();
  try { navigator.wakeLock?.request('screen').catch(() => {}); } catch (e) {}
}

function fit() {
  const board = $('board'), grid = $('grid');
  const W = board.clientWidth, H = board.clientHeight;
  if (!W || !H) return;
  const gap = Math.max(8, Math.min(W, H) * 0.022);
  const size = Math.floor(Math.min((W - gap * (cols - 1)) / cols, (H - gap * (rows - 1)) / rows));
  grid.style.setProperty('--size', size + 'px');
  grid.style.setProperty('--gap', gap + 'px');
}
addEventListener('resize', fit);

function tap(i) {
  const c = cards[i];
  if (c.gone) return;
  if (c.open) { say(c.d.say); return; }   // offene Karte nochmal antippen: Name nochmal hören
  if (lock) return;
  c.open = true; c.el.classList.add('open'); c.el.setAttribute('aria-label', c.d.name);
  later(() => say(c.d.say), 200);

  if (first === null) { first = i; return; }
  const a = cards[first]; first = null; lock = true;
  if (a.d.id === c.d.id) {
    later(() => {
      [a, c].forEach(vanish);
      chime();
      const egg = $('eggs').children[found];
      egg.classList.add('full'); egg.style.background = c.d.bg;
      found++;
      lock = false;
      if (found === pairs) later(win, 900);
    }, 1700);
  } else {
    later(() => { [a, c].forEach(x => { x.open = false; x.el.classList.remove('open'); x.el.setAttribute('aria-label', 'Verdeckte Karte'); }); lock = false; }, 2500);
  }
}

function vanish(c) {
  c.gone = true;
  const r = c.el.getBoundingClientRect();
  const colors = ['#ffcf4a', '#fffdf6', c.d.bg];
  for (let k = 0; k < 10; k++) {
    const s = document.createElement('span');
    const ang = (k / 10) * Math.PI * 2, dist = r.width * (0.5 + Math.random() * 0.3);
    s.className = 'spark';
    s.style.left = (r.left + r.width / 2 - 8) + 'px'; s.style.top = (r.top + r.height / 2 - 8) + 'px';
    s.style.setProperty('--dx', Math.cos(ang) * dist + 'px'); s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
    s.innerHTML = STAR(colors[k % 3]);
    document.body.append(s);
    setTimeout(() => s.remove(), 900);
  }
  c.el.classList.add('vanish');
  later(() => c.el.classList.add('gone'), 600);   // Platz bleibt leer, nichts rückt nach
}

function win() {
  const played = [...new Map(cards.map(c => [c.d.id, c.d])).values()];
  // doppelt hintereinander, damit die Polonaise lang genug ist
  $('parade').innerHTML = [...played, ...played].map(d => `<div class="dancer">${dinoSVG(d)}</div>`).join('');
  [...$('parade').children].forEach((el, i) => el.style.animationDelay = (i % 2 ? 0.27 : 0) + 's');
  $('win').querySelectorAll('.confetti').forEach(x => x.remove());
  const cc = ['#ffcf4a', '#ff8fb7', '#7cc6fe', '#fffdf6', '#ff9f43', '#b9a7ff'];
  for (let k = 0; k < 28; k++) {
    const f = document.createElement('span');
    f.className = 'confetti';
    f.style.left = Math.random() * 100 + 'vw';
    f.style.background = cc[k % cc.length];
    f.style.animationDuration = (3 + Math.random() * 3) + 's';
    f.style.animationDelay = (-Math.random() * 5) + 's';
    $('win').prepend(f);
  }
  $('win').hidden = false;
  fanfare();
}

function home() {
  timers.forEach(clearTimeout); timers = [];
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  $('game').hidden = true; $('win').hidden = true; $('start').hidden = false;
}
$('home').onclick = home;
$('other').onclick = home;
$('again').onclick = () => startGame(pairs);
$('sound').onclick = () => {
  soundOn = !soundOn;
  if (!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel();
  // SVG-Elemente kennen die hidden-Eigenschaft nicht, daher über das Attribut
  $('wave1').toggleAttribute('hidden', !soundOn); $('wave2').toggleAttribute('hidden', !soundOn);
  $('mute').toggleAttribute('hidden', soundOn);
  $('sound').classList.toggle('off', !soundOn);
  $('sound').setAttribute('aria-label', soundOn ? 'Ton aus' : 'Ton an');
};
</script>
